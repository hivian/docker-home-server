services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8082:8082     # qbittorrent webui
      - 6881:6881     # qbittorrent torrent TCP
      - 6881:6881/udp # qbittorrent torrent UDP
      - 9117:9117     # jackett
    volumes:
      - ${VOLUME_PATH}/config/gluetun:/gluetun
    networks:
      - traefik-network
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - VPN_ENDPOINT_IP=${VPN_ENDPOINT_IP}
      - VPN_ENDPOINT_PORT=${VPN_ENDPOINT_PORT}
      - DNS_ADDRESS=${DNS_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # push the NAT-PMP port into qBittorrent: same net namespace, WebUI auth off on this subnet
      - 'VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c ''wget -qO- --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8082/api/v2/app/setPreferences'''
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`${QBITTORRENT_SUB_DOMAIN}.${SERVER_DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.service=qbittorrent
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8082
      - traefik.http.routers.jackett.rule=Host(`${JACKETT_SUB_DOMAIN}.${SERVER_DOMAIN}`)
      - traefik.http.routers.jackett.entrypoints=websecure
      - traefik.http.routers.jackett.service=jackett
      - traefik.http.services.jackett.loadbalancer.server.port=9117
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=022
      - WEBUI_PORT=8082
      - TORRENTING_PORT=6881
    volumes:
      - ${VOLUME_PATH}/config/qbittorrent:/config
      - ${VOLUME_PATH}/media:/downloads
    healthcheck:
      test: curl -f http://localhost:8082 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - autoheal=true
      - homepage.group=Media
      - homepage.name=qBittorrent
      - homepage.icon=qbittorrent
      - homepage.href=${URL_SCHEME}://${QBITTORRENT_SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.description=P2P BitTorrent client
      - homepage.widget.type=qbittorrent
      - homepage.widget.url=${URL_SCHEME}://${QBITTORRENT_SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.widget.fields=["leech", "download", "seed", "upload"]

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    network_mode: service:gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true
    volumes:
      - ${VOLUME_PATH}/config/jackett:/config
    healthcheck:
      test: curl -f http://localhost:9117 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - autoheal=true
      - homepage.group=Media
      - homepage.name=Jackett
      - homepage.icon=jackett
      - homepage.href=${URL_SCHEME}://${JACKETT_SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.description=Torrent indexer proxy
      - homepage.widget.type=jackett
      - homepage.widget.url=${URL_SCHEME}://${JACKETT_SUB_DOMAIN}.${SERVER_DOMAIN}

  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${VOLUME_PATH}/config/jellyfin:/config
      - ${VOLUME_PATH}/media/tv:/data/tvshows
      - ${VOLUME_PATH}/media/movies:/data/movies
    ports:
      - 8096:8096
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`${JELLYFIN_SUB_DOMAIN}.${SERVER_DOMAIN}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin
      - homepage.href=${URL_SCHEME}://${JELLYFIN_SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.description=Watch movies and TV shows.
      - homepage.widget.type=jellyfin
      - homepage.widget.url=${URL_SCHEME}://${JELLYFIN_SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.widget.key=${JELLYFIN_API_KEY}
      - homepage.widget.enableBlocks=true
      - homepage.widget.enableNowPlaying=true
    security_opt:
      - no-new-privileges:true

  unmanic:
    image: josh5/unmanic:latest
    container_name: unmanic
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${VOLUME_PATH}/config/unmanic:/config
      - ${VOLUME_PATH}/media:/library
      - ${VOLUME_PATH}/cache/unmanic:/tmp/unmanic
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "110" # render group on this host, cf. getent group render
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.unmanic.rule=Host(`${UNMANIC_SUB_DOMAIN}.${SERVER_DOMAIN}`)
      - traefik.http.routers.unmanic.entrypoints=websecure
      - traefik.http.services.unmanic.loadbalancer.server.port=8888
      - homepage.group=Media
      - homepage.name=Unmanic
      - homepage.icon=unmanic
      - homepage.href=${URL_SCHEME}://${UNMANIC_SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.description=Library transcoding
    security_opt:
      - no-new-privileges:true

networks:
  traefik-network:
    external: true
