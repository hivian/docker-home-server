services:
  hermes:
    # libopus needed for Discord voice channels; rebuild with `docker compose build --pull` to update
    build:
      dockerfile_inline: |
        FROM nousresearch/hermes-agent:latest
        USER root
        RUN apt-get update && apt-get install -y --no-install-recommends libopus0 && rm -rf /var/lib/apt/lists/*
    container_name: hermes
    command: gateway run
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
      # Docker CLI shipped in the image talks to the filtered proxy, never the raw socket
      DOCKER_HOST: tcp://hermes-dockerproxy:2375
    volumes:
      - ${VOLUME_PATH}/data:/opt/data
    networks:
      - traefik-network
      - hermes-docker
    depends_on:
      - hermes-dockerproxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.routers.hermes.rule=Host(`${SUB_DOMAIN}.${SERVER_DOMAIN}`)
      - traefik.http.routers.hermes.entrypoints=websecure
      - traefik.http.services.hermes.loadbalancer.server.port=9119
      - homepage.group=Infrastructure
      - homepage.name=Hermes
      - homepage.icon=mdi-robot
      - homepage.href=${URL_SCHEME}://${SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.description=AI agent piloting containers

  hermes-dockerproxy:
    image: wollomatic/socket-proxy:1.13.2
    container_name: hermes-dockerproxy
    # 65534 = nobody; group = host docker GID (getent group docker)
    user: "65534:${DOCKER_GID}"
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Allowlist by container name (IDs don't match, so no bypass). No `docker ps`: its labels leak API keys (homepage.widget.key).
    # Never add containers that mount docker.sock (traefik, dockge, dockerproxy, autoheal): exec there = root on host
    command:
      - -listenip=0.0.0.0
      - -allowfrom=hermes
      - -allowHEAD=(/v1\..{1,2})?/_ping
      - -allowGET=(/v1\..{1,2})?/(_ping|version|containers/(jellyfin|qbittorrent|jackett|unmanic|homeassistant)/.*|exec/[^/]+/json)
      - -allowPOST=/v1\..{1,2}/(containers/(jellyfin|qbittorrent|jackett|unmanic|homeassistant)/(start|stop|restart|kill|exec|resize|wait|attach)|exec/[^/]+/(start|resize))
    networks:
      - hermes-docker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  traefik-network:
    external: true
  hermes-docker:
    internal: true
