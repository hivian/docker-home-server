services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
      - 8083:80/tcp
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PASSWORD}
      FTLCONF_dns_upstreams: 172.18.0.21#5053
      # Bridge network: LAN queries arrive from non-local subnets, v6 default (local) would refuse them
      FTLCONF_dns_listeningMode: all
    volumes:
      - ${VOLUME_PATH}/etc-pihole:/etc/pihole
      - ${VOLUME_PATH}/etc-dnsmasq.d:/etc/dnsmasq.d
    networks:
      traefik-network:
        ipv4_address: 172.18.0.20
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.pihole.rule=Host(`${SUB_DOMAIN}.${SERVER_DOMAIN}`)
      - traefik.http.routers.pihole.entrypoints=websecure
      - traefik.http.services.pihole.loadbalancer.server.port=80
      # v6 serves the UI at /admin but the API at /api, so only redirect the bare root
      - traefik.http.routers.pihole.middlewares=pihole-root
      - traefik.http.middlewares.pihole-root.redirectregex.regex=^https?://([^/]+)/?$$
      - traefik.http.middlewares.pihole-root.redirectregex.replacement=https://$${1}/admin/
      - homepage.group=Infrastructure
      - homepage.name=Pihole
      - homepage.icon=pi-hole
      - homepage.href=${URL_SCHEME}://${SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.description=DNS server
      - homepage.widget.type=pihole
      - homepage.widget.url=${URL_SCHEME}://${SUB_DOMAIN}.${SERVER_DOMAIN}
      - homepage.widget.version=6
      - homepage.widget.key=${API_KEY}
      - homepage.widget.fields=["queries", "blocked", "blocked_percent", "gravity"]

  unbound:
    container_name: unbound
    image: "mvance/unbound:latest"
    networks:
      traefik-network:
        ipv4_address: 172.18.0.21
    # unbound.conf listens on 5053 (interface 0.0.0.0@5053), not the image default 53
    ports:
      - "5053:5053/tcp"
      - "5053:5053/udp"
    healthcheck:
      test: ["CMD-SHELL", "drill -p 5053 @127.0.0.1 cloudflare.com || exit 1"]
    volumes:
      - ${VOLUME_PATH}/etc-unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf
      - ${VOLUME_PATH}/etc-unbound/a-records.conf:/opt/unbound/etc/unbound/a-records.conf
      - ${VOLUME_PATH}/etc-unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf
    restart: unless-stopped

networks:
  traefik-network:
    external: true
