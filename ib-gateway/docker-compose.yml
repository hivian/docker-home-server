# IBC's command server, for Flight Desk's logout button: STOP closes the gateway, which Docker starts again logged out
# (IBC has no command to log out alone). IBC takes commands from its own host only: inside the container it listens on
# 7462 and a socat relays the published port 7463 to it. It accepts no order, only STOP, RESTART and reconnections.
# On the host, 7462 and 7461 are the paper and live gateways' command ports, mapped to 7463 in each container.
# The sed patches the image's template, on the floating :stable tag: the container stops if the line it looks for is gone.
x-ibc-commands: &ibc-commands
  - bash
  - -c
  - |
    sed -i 's/^CommandServerPort=0\r\?$$/CommandServerPort=7462\r/' /home/ibgateway/ibc/config.ini.tmpl
    grep -q '^CommandServerPort=7462' /home/ibgateway/ibc/config.ini.tmpl || { echo "CommandServerPort introuvable dans config.ini.tmpl" >&2; exit 1; }
    socat TCP-LISTEN:7463,fork,reuseaddr TCP:127.0.0.1:7462 &
    exec /home/ibgateway/scripts/run.sh

x-gateway-env: &gateway-env
  READ_ONLY_API: "no"
  # Nobody watches the gateway's window: an unanswered "accept incoming connection" dialog would block every API client
  TWS_ACCEPT_INCOMING: accept
  # Same reason for the API order precaution dialogs; the flight-desk engine runs its own pre-trade checks
  BYPASS_WARNING: "yes"
  TWOFA_TIMEOUT_ACTION: restart
  RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
  # IBKR forces a daily restart; scheduled before the European open but after IBKR's own daily reset of its European
  # servers (06:25-07:45 CET): a restart during it cannot authenticate and leaves the gateway stuck ("Restart in progress")
  AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-08:00 AM}
  TIME_ZONE: ${TZ:-Europe/Paris}
  TZ: ${TZ:-Europe/Paris}
  JAVA_HEAP_SIZE: ${JAVA_HEAP_SIZE:-768}

# Both gateways listen on the host loopback only: the flight-desk engine is the only client of their APIs, and relays
# the live window behind its own session. Never route through Traefik, never add to the Hermes allowlist.
# The oanda-bot-python stack also names its container ib-gateway and binds 4002, 4001 and 5900: never run it beside this one.
x-gateway: &gateway
  image: ghcr.io/gnzsnz/ib-gateway:stable
  restart: unless-stopped
  command: *ibc-commands
  deploy:
    resources:
      limits:
        memory: 1536M
  security_opt:
    - no-new-privileges:true

services:
  ib-gateway:
    <<: *gateway
    container_name: ib-gateway
    environment:
      <<: *gateway-env
      TWS_USERID: ${TWS_USERID:?TWS_USERID manquant dans ib-gateway/.env}
      TWS_PASSWORD_FILE: /run/secrets/tws_password
      TRADING_MODE: paper
    secrets:
      - tws_password
    ports:
      - "127.0.0.1:4002:4004" # paper API
      - "127.0.0.1:7462:7463" # IBC commands (logout)
    # Healthy = logged in, i.e. connected to the IBKR servers (ports 4000/4001, hex 0FA0/0FA1, state 01 = established).
    # A gateway that loses them can keep its API port open and answer nothing, as after a failed daily restart.
    healthcheck:
      test: ["CMD", "grep", "-qsE", ":0FA[01] 01 ", "/proc/net/tcp", "/proc/net/tcp6"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true

  # The live account. It keeps no credentials: the trader logs in from its window, shown in Flight Desk through VNC,
  # and confirms on IBKR Mobile. Kept apart from the paper gateway so that its window is the only one there.
  ib-gateway-live:
    <<: *gateway
    container_name: ib-gateway-live
    environment:
      <<: *gateway-env
      TWS_USERID: ""
      TRADING_MODE: live
      VNC_SERVER_PASSWORD_FILE: /run/secrets/vnc_password
    secrets:
      - vnc_password
    # x11vnc reads its options from ~/.x11vncrc: a Caps Lock from the browser (a Mac sends one when it switches input
    # language) would lock the gateway's capitals unseen and spoil the password typed next.
    configs:
      - source: x11vncrc
        target: /home/ibgateway/.x11vncrc
        mode: 0444
    ports:
      - "127.0.0.1:4001:4003" # live API
      - "127.0.0.1:5900:5900" # IB Gateway window (VNC)
      - "127.0.0.1:7461:7463" # IBC commands (logout)
    # No healthcheck nor autoheal: logged out is its normal state until the trader logs in, and a restart would log
    # the live account out, to be logged in again by hand.

secrets:
  tws_password:
    file: ./secrets/tws_password
  vnc_password:
    file: ./secrets/vnc_password

configs:
  x11vncrc:
    content: |
      skip_lockkeys
